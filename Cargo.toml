[package]
name = "agentcut"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
worker = { version = "0.8.5", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
