<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentCut</title>
<link rel="icon" href="/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="chat" id="chat">
    <header class="chat-head">
      <button class="avatar" id="account" title="Account">A<i></i></button>
      <button class="brand-pill" id="project-pill" title="Projects"><img src="/mark.svg" alt=""><span id="project-name">AgentCut</span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="new-project" title="New project"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </header>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-context" id="chat-context"></div>
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Ask the agent to cut, speed up, mute…"></textarea>
      <button class="press send" id="send" title="Send"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </aside>
  <main class="desk" id="desk">
    <nav class="dock" id="dock">
      <button data-tab="media" title="Media"><span class="tile t-media"><svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l1.8 2h7.6a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="#fff"/></svg></span></button>
      <button data-tab="text" title="Text and fonts"><span class="tile t-text"><svg viewBox="0 0 24 24"><path d="M6 6.5h12M12 6.5v12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span></button>
      <button data-tab="clip" title="Clip: speed, sound, keyframes"><span class="tile t-clip"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 16h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="8" r="2.4" fill="#fff"/><path d="m15 13.6 2.4 2.4-2.4 2.4-2.4-2.4z" fill="#fff"/></svg></span></button>
      <button data-tab="effects" title="Effects"><span class="tile t-effects"><svg viewBox="0 0 24 24"><path d="M12 4.5 13.8 10.2 19.5 12l-5.7 1.8L12 19.5l-1.8-5.7L4.5 12l5.7-1.8z" fill="#fff"/></svg></span></button>
      <button data-tab="look" title="Look and contrast"><span class="tile t-look"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 5a7 7 0 0 1 0 14z" fill="#fff"/></svg></span></button>
      <hr>
      <button data-tab="export" title="Export"><span class="tile t-export"><svg viewBox="0 0 24 24"><path d="M12 15V5M8 9l4-4 4 4M6 15v3h12v-3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <button data-tab="mcp" title="MCP for other agents"><span class="tile t-mcp"><svg viewBox="0 0 24 24"><path d="M9 4v4M15 4v4M7 8h10v3a5 5 0 0 1-10 0zM12 16v4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    </nav>
    <section class="win" id="editor">
      <header class="win-head">
        <h1>Editor</h1>
        <span class="win-meta" id="win-meta"></span>
      </header>
      <div class="win-body">
        <div class="side" id="side"></div>
        <div class="stage" id="stage">
          <div class="frame"><canvas id="stage-canvas" width="1280" height="720"></canvas></div>
          <div class="transport" id="transport">
            <span class="clock" id="clock">0:00.00 / 0:00.00</span>
            <span class="t-group">
              <button id="to-start" title="Start (Home)">⏮</button>
              <button id="back" title="Back 1 s">↺</button>
              <button id="play" class="play" title="Play (Space)">▶</button>
              <button id="ahead" title="Ahead 1 s">↻</button>
              <button id="to-end" title="End (End)">⏭</button>
            </span>
            <span class="t-group right">
              <button id="split" title="Split at playhead (S)">Split</button>
              <button id="delete" title="Delete clip (Del)">Delete</button>
              <button id="undo" title="Undo (Ctrl+Z)">↶</button>
              <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
            </span>
          </div>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
